name: Package Build

on:
  workflow_dispatch:
    inputs:
      run_windows_x64:
        description: 'Windows x64'
        required: false
        type: boolean
        default: true
      run_windows_arm64:
        description: 'Windows ARM64'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: 'macOS Apple Silicon'
        required: false
        type: boolean
        default: true
      run_macos_x64:
        description: 'macOS Intel'
        required: false
        type: boolean
        default: true
      run_linux_amd64:
        description: 'Linux amd64 (deb)'
        required: false
        type: boolean
        default: true
      run_linux_amd64_appimage:
        description: 'Linux amd64 (AppImage)'
        required: false
        type: boolean
        default: true
      run_linux_arm64:
        description: 'Linux arm64 (deb)'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Upload packages to a GitHub prerelease'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  # Keep service binary aligned with clash_verge_service_ipc = 2.3.3
  SERVICE_VERSION_PIN: v2.3.3
  # Match release/autobuild; rustc 1.95.0 + codegen-units=1 can SIGTRAP in LLVM.
  RUSTUP_TOOLCHAIN: '1.97.1'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
  CARGO_PROFILE_RELEASE_DEBUG: '0'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package version
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG_NAME="package-${VERSION}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG_NAME}"

      - name: Create prerelease
        id: create_release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: 'Package ${{ steps.meta.outputs.version }} (${{ github.sha }})'
          body: |
            Manual package build for `${{ github.ref_name }}`.

            Commit: `${{ github.sha }}`
            Triggered by: `@${{ github.actor }}`
          prerelease: true
          draft: false
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package ${{ matrix.id }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            input: run_windows_x64
            artifact: windows-x64
            path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - id: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            input: run_windows_arm64
            artifact: windows-arm64
            path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - id: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            input: run_macos_aarch64
            artifact: macos-aarch64
            path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            input: run_macos_x64
            artifact: macos-x64
            path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - id: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            input: run_linux_amd64
            artifact: linux-amd64
            path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          - id: linux-amd64-appimage
            # Newer glib reduces tray symbol mismatches on modern host distros.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            input: run_linux_amd64_appimage
            artifact: linux-amd64-appimage
            path: target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            appimage: true
          - id: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
            bundle: deb
            input: run_linux_arm64
            artifact: linux-arm64
            path: target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip if disabled
        if: ${{ github.event.inputs[matrix.input] != 'true' }}
        run: echo "Skip ${{ matrix.id }}"

      - name: Checkout
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: actions/checkout@v7

      - name: Install Rust
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}

      - name: Add Rust target
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: package-v2
          key: ${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true

      - name: Install Linux deps (amd64)
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.cross != true && github.event.inputs[matrix.input] == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          if [ "${{ matrix.appimage }}" = "true" ]; then
            # Ubuntu 24.04 renames the package; fall back for 22.04.
            sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          fi

      - name: Bundle AppImage tray libraries
        if: ${{ matrix.appimage == true && github.event.inputs[matrix.input] == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          libdir = subprocess.check_output(
              ["pkg-config", "--variable=libdir", "ayatana-appindicator3-0.1"],
              text=True,
          ).strip()
          root = Path(libdir)
          # Keep tray dlopen() on AppImage libs (same glib ABI) instead of host /usr/lib.
          names = [
              "libayatana-appindicator3.so.1",
              "libayatana-indicator3.so.7",
              "libayatana-ido3-0.4.so.0",
              "libdbusmenu-glib.so.4",
              "libdbusmenu-gtk3.so.4",
          ]
          files = {}
          for name in names:
              src = root / name
              if not src.exists():
                  # Some sonames differ slightly across Ubuntu versions.
                  matches = sorted(root.glob(name.split(".so")[0] + ".so*"))
                  if not matches:
                      raise SystemExit(f"missing tray library: {src}")
                  src = matches[0]
              files[str(src)] = f"lib/{src.name}"
              print(f"bundle {src} -> lib/{src.name}")

          path = Path("src-tauri/tauri.linux.conf.json")
          data = json.loads(path.read_text())
          data.setdefault("bundle", {}).setdefault("linux", {}).setdefault("appimage", {})["files"] = files
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("updated tauri.linux.conf.json appimage.files")
          PY

      - name: Install Linux deps (arm64 cross)
        if: ${{ matrix.cross == true && github.event.inputs[matrix.input] == 'true' }}
        run: |
          cat > /tmp/sources.list << EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted

          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }} \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Setup pnpm
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Pin service version
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        shell: bash
        run: |
          mkdir -p node_modules/.verge
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          p = Path('node_modules/.verge/.version_cache.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          data['SERVICE_VERSION'] = {
            'version': os.environ['SERVICE_VERSION_PIN'],
            'timestamp': int(time.time() * 1000),
          }
          p.write_text(json.dumps(data, indent=2) + '\n')
          print(data['SERVICE_VERSION'])
          PY
          rm -f src-tauri/resources/clash-verge-service \
                src-tauri/resources/clash-verge-service-install \
                src-tauri/resources/clash-verge-service-uninstall \
                src-tauri/resources/clash-verge-service.exe \
                src-tauri/resources/clash-verge-service-install.exe \
                src-tauri/resources/clash-verge-service-uninstall.exe

      - name: Prebuild sidecars and resources
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Force ad-hoc macOS signing
        if: ${{ matrix.os == 'macos-latest' && github.event.inputs[matrix.input] == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('src-tauri/tauri.macos.conf.json')
          data = json.loads(path.read_text())
          data.setdefault('bundle', {}).setdefault('macOS', {})['signingIdentity'] = '-'
          path.write_text(json.dumps(data, indent=2) + '\n')
          print('macOS signingIdentity ->', data['bundle']['macOS']['signingIdentity'])
          PY

      - name: Build package
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        shell: bash
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          # linuxdeploy's bundled strip breaks on modern ELF (.relr.dyn); required for AppImage.
          NO_STRIP: ${{ matrix.appimage == true && 'true' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.cross == true && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.cross == true && '/usr/lib/aarch64-linux-gnu/pkgconfig/' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.cross == true && '/usr/aarch64-linux-gnu/' || '' }}
        run: |
          # Ensure empty/missing Apple secrets cannot trigger `security import`.
          unset APPLE_CERTIFICATE \
                APPLE_CERTIFICATE_PASSWORD \
                APPLE_SIGNING_IDENTITY \
                APPLE_ID \
                APPLE_PASSWORD \
                APPLE_TEAM_ID \
                APPLE_API_KEY \
                APPLE_API_ISSUER \
                TAURI_SIGNING_PRIVATE_KEY \
                TAURI_SIGNING_PRIVATE_KEY_PASSWORD || true
          pnpm build --target "${{ matrix.target }}" -b "${{ matrix.bundle }}"

      - name: Upload artifact
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to prerelease
        if: ${{ inputs.publish_release && github.event.inputs[matrix.input] == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag_name }}" \
            ${{ matrix.path }} \
            --clobber
