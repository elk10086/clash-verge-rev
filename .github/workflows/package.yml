name: Package Build

on:
  workflow_dispatch:
    inputs:
      run_windows_x64:
        description: 'Windows x64'
        required: false
        type: boolean
        default: true
      run_windows_arm64:
        description: 'Windows ARM64'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: 'macOS Apple Silicon'
        required: false
        type: boolean
        default: true
      run_macos_x64:
        description: 'macOS Intel'
        required: false
        type: boolean
        default: true
      run_linux_amd64:
        description: 'Linux amd64'
        required: false
        type: boolean
        default: true
      run_linux_arm64:
        description: 'Linux arm64'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Upload packages to a GitHub prerelease'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
  # Keep service binary aligned with clash_verge_service_ipc = 2.3.3
  SERVICE_VERSION_PIN: v2.3.3

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package version
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG_NAME="package-${VERSION}-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG_NAME}"

      - name: Create prerelease
        id: create_release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: 'Package ${{ steps.meta.outputs.version }} (${{ github.sha }})'
          body: |
            Manual package build for `${{ github.ref_name }}`.

            Commit: `${{ github.sha }}`
            Triggered by: `@${{ github.actor }}`
          prerelease: true
          draft: false
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package ${{ matrix.id }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            input: run_windows_x64
            artifact: windows-x64
            path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - id: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundle: nsis
            input: run_windows_arm64
            artifact: windows-arm64
            path: target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - id: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            input: run_macos_aarch64
            artifact: macos-aarch64
            path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            input: run_macos_x64
            artifact: macos-x64
            path: target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - id: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            input: run_linux_amd64
            artifact: linux-amd64
            path: target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          - id: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            arch: arm64
            bundle: deb
            input: run_linux_arm64
            artifact: linux-arm64
            path: target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip if disabled
        if: ${{ github.event.inputs[matrix.input] != 'true' }}
        run: echo "Skip ${{ matrix.id }}"

      - name: Checkout
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: actions/checkout@v7

      - name: Install Rust
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}

      - name: Add Rust target
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: package-v1
          key: ${{ matrix.os }}-${{ matrix.target }}
          workspaces: |
            . -> target
          cache-all-crates: true

      - name: Install Linux deps (amd64)
        if: ${{ matrix.os == 'ubuntu-22.04' && matrix.cross != true && github.event.inputs[matrix.input] == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Linux deps (arm64 cross)
        if: ${{ matrix.cross == true && github.event.inputs[matrix.input] == 'true' }}
        run: |
          cat > /tmp/sources.list << EOF
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted

          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libxslt1.1:${{ matrix.arch }} \
            libwebkit2gtk-4.1-dev:${{ matrix.arch }} \
            libayatana-appindicator3-dev:${{ matrix.arch }} \
            libssl-dev:${{ matrix.arch }} \
            patchelf:${{ matrix.arch }} \
            librsvg2-dev:${{ matrix.arch }} \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Setup pnpm
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'

      - name: Install dependencies
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Pin service version
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        shell: bash
        run: |
          mkdir -p node_modules/.verge
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          p = Path('node_modules/.verge/.version_cache.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          data['SERVICE_VERSION'] = {
            'version': os.environ['SERVICE_VERSION_PIN'],
            'timestamp': int(time.time() * 1000),
          }
          p.write_text(json.dumps(data, indent=2) + '\n')
          print(data['SERVICE_VERSION'])
          PY
          rm -f src-tauri/resources/clash-verge-service \
                src-tauri/resources/clash-verge-service-install \
                src-tauri/resources/clash-verge-service-uninstall \
                src-tauri/resources/clash-verge-service.exe \
                src-tauri/resources/clash-verge-service-install.exe \
                src-tauri/resources/clash-verge-service-uninstall.exe

      - name: Prebuild sidecars and resources
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        run: pnpm run prebuild ${{ matrix.target }}

      - name: Build (native, with release upload)
        if: ${{ matrix.cross != true && inputs.publish_release && github.event.inputs[matrix.input] == 'true' }}
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseDraft: false
          prerelease: true

      - name: Build (native, artifacts only)
        if: ${{ matrix.cross != true && !inputs.publish_release && github.event.inputs[matrix.input] == 'true' }}
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Build (linux arm64 cross)
        if: ${{ matrix.cross == true && github.event.inputs[matrix.input] == 'true' }}
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig/
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu/
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm build --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Upload artifact
        if: ${{ github.event.inputs[matrix.input] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload linux arm64 to release
        if: ${{ matrix.cross == true && inputs.publish_release && github.event.inputs[matrix.input] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag_name }}" \
            ${{ matrix.path }} \
            --clobber
